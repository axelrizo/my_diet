schema {
  query: RootQueryType
}

type RootQueryType {
  "Get all foods"
  foods: [Food]

  "Get all food categories"
  foodCategories: [FoodCategory]

  "Get all meals"
  meals: [Meal]
}

"A meal, which consists of multiple food measures (meal ingredients)"
type Meal {
  "The unique identifier of the meal"
  id: ID

  "The name of the meal (e.g., 'Eggs and Toast', 'Chicken Salad')"
  name: String!

  "The ingredients that make up this meal, each with a specific food measure and quantity"
  mealIngredients: [MealIngredient]
}

"An ingredient within a meal"
type MealIngredient {
  "The unique identifier of the meal ingredient"
  id: ID

  "The quantity of the food measure used in this meal ingredient (e.g., 2 for 2 cups)"
  quantity: Decimal!

  "The meal that this ingredient belongs to"
  foodMeasure: FoodMeasure
}

"A food, which belongs to a category and has multiple measures"
type Food {
  "The unique identifier of the food"
  id: ID

  "The name of the food"
  name: String!

  "The category this food belongs to"
  foodCategory: FoodCategory

  "The different measures for this food, each with its own nutritional information"
  foodMeasures: [FoodMeasure]
}

"A food's category, which can have multiple foods"
type FoodCategory {
  "The unique identifier of the food category"
  id: ID

  "The name of the food category (e.g., 'Fruits', 'Vegetables', 'Grains')"
  name: String!

  "The food items that belong to this category"
  foods: [Food]
}

"A food measure, which specifies the portion size and its nutritional information for a specific food"
type FoodMeasure {
  "The unique identifier of the food measure"
  id: ID

  "The name of the measure (e.g., 'cup', 'slice', 'piece')"
  portion: String!

  "Fats in grams for this measure of the food"
  fats: Decimal!

  "Carbohydrates in grams for this measure of the food"
  carbohydrates: Decimal!

  "Proteins in grams for this measure of the food"
  proteins: Decimal!

  "The food that this measure belongs to"
  food: Food

  "The meal ingredients that use this food measure"
  mealIngredients: [MealIngredient]
}

"A decimal value"
scalar Decimal
